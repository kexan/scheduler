<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планировщик миграций</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .slot-available {
            background-color: #d4edda;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .slot-available:hover {
            background-color: #c3e6cb;
        }
        .slot-booked {
            background-color: #f8d7da;
            cursor: not-allowed;
        }
        .admin-controls {
            display: none;
            margin-bottom: 20px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
        }
        .admin-controls.show {
            display: block;
        }
        .booking-info {
            font-size: 0.9em;
            color: #6c757d;
        }
        .time-slot {
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 5px;
        }
        .modal-body .form-group {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <header class="mb-4">
            <h1 class="text-center">📅 Планировщик миграций компаний</h1>
            <div class="text-center">
                <button id="adminToggle" class="btn btn-outline-primary btn-sm">🔧 Режим администратора</button>
            </div>
        </header>

        <!-- Панель администратора -->
        <div id="adminPanel" class="admin-controls">
            <h3>🔧 Панель администратора</h3>
            <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#createSlotModal">
                ➕ Создать новый слот
            </button>
            <div id="adminSlotsList"></div>
        </div>

        <!-- Основная таблица слотов -->
        <div class="row">
            <div class="col-12">
                <h3>📋 Доступные слоты для записи</h3>
                <div id="slotsContainer" class="row">
                    <!-- Слоты будут загружены через JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно создания слота -->
    <div class="modal fade" id="createSlotModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Создать новый слот</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createSlotForm">
                        <div class="form-group">
                            <label for="slotDate">Дата</label>
                            <input type="date" class="form-control" id="slotDate" required>
                        </div>
                        <div class="form-group">
                            <label for="slotStartTime">Время начала</label>
                            <input type="time" class="form-control" id="slotStartTime" required>
                        </div>
                        <div class="form-group">
                            <label for="slotEndTime">Время окончания</label>
                            <input type="time" class="form-control" id="slotEndTime" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Создать слот</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно бронирования -->
    <div class="modal fade" id="bookingModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Запись на слот</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="bookingForm">
                        <div class="form-group">
                            <label for="companyName">Название компании</label>
                            <input type="text" class="form-control" id="companyName" required>
                        </div>
                        <div class="form-group">
                            <label for="adminEmail">Почта администратора компании в облаке</label>
                            <input type="email" class="form-control" id="adminEmail" required>
                        </div>
                        <div class="form-group">
                            <label for="companyId">ID компании (Ctrl+Alt+Q)</label>
                            <input type="text" class="form-control" id="companyId" required>
                        </div>
                        <div class="form-group">
                            <label for="downloadEmail">Почта для скачивания</label>
                            <input type="email" class="form-control" id="downloadEmail" required>
                        </div>
                        <button type="submit" class="btn btn-success">Записаться</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования слота -->
    <div class="modal fade" id="editSlotModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Редактировать слот</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editSlotForm">
                        <input type="hidden" id="editSlotId">
                        <div class="form-group">
                            <label for="editSlotDate">Дата</label>
                            <input type="date" class="form-control" id="editSlotDate" required>
                        </div>
                        <div class="form-group">
                            <label for="editSlotStartTime">Время начала</label>
                            <input type="time" class="form-control" id="editSlotStartTime" required>
                        </div>
                        <div class="form-group">
                            <label for="editSlotEndTime">Время окончания</label>
                            <input type="time" class="form-control" id="editSlotEndTime" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
